name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building tms-api ${{ github.ref_name }}"

  change:
    name: Change
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v4.0.0
        with:
          devops-integration-user-name: ${{ secrets.SN_DEVOPS_USER }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Change'
          change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"short_description":"tms-api ${{ github.ref_name }} deploy to GDC + IDC","description":"Pipeline change. Risk Assessment + Golden Rules + approvals required before deploy.","assignment_group":"PASTE_VAS_APPDEV_SYS_ID","implementation_plan":"Deploy GDC, then IDC","backout_plan":"Redeploy previous version via rollback workflow","test_plan":"Smoke test per DC"}}'
          interval: '60'
          timeout: '86400'
          changeCreationTimeOut: '600'
          abortOnChangeCreationFailure: true

  deploy:
    name: Deploy ${{ matrix.dc }}
    needs: change
    strategy:
      max-parallel: 1
      matrix:
        dc: [GDC, IDC]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying ${{ github.ref_name }} to ${{ matrix.dc }}"
